version: 2
project_name: conctl
release:
  github:
    owner: darinkelkhoff
    name: connectedCli
builds:
  - id: conctl
    main: ./cmd/conctl
    binary: conctl
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/darinkelkhoff/connectedCli/internal/cli.Version={{.Version}}
    hooks:
      # Sign (Developer ID + hardened runtime) and notarize each binary
      # before it is archived, so the published tarball passes Gatekeeper.
      post:
        - './scripts/sign-and-notarize.sh "{{ .Path }}"'
archives:
  - formats: [tar.gz]
homebrew_casks:
  - name: conctl
    repository:
      owner: darinkelkhoff
      name: homebrew-tap
    homepage: "https://github.com/darinkelkhoff/connectedCli"
    description: "A command-line companion for the Connected podcast"
    dependencies:
      - formula: ffmpeg
