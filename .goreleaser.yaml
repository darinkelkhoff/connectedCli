version: 2
project_name: conctl
release:
  github:
    owner: dkelkhoff
    name: connectedCli
builds:
  - id: conctl
    main: ./cmd/conctl
    binary: conctl
    env: [CGO_ENABLED=0]
    goos: [darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/dkelkhoff/connectedCli/internal/cli.Version={{.Version}}
archives:
  - formats: [tar.gz]
homebrew_casks:
  - name: conctl
    repository:
      owner: dkelkhoff
      name: homebrew-tap
    homepage: "https://github.com/dkelkhoff/connectedCli"
    description: "A command-line companion for the Connected podcast"
    dependencies:
      - formula: ffmpeg
    # Remove the Gatekeeper quarantine flag so the unsigned binary runs.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/conctl"]
          end
